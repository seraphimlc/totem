# First-cut HTTP site for cad.visitworld.me
# Place in /etc/nginx/conf.d/ (add-only; do not merge into other vhosts).
# Issue TLS later with webroot /opt/visitworld-deploy/acme, then switch to the tls example.

server {
    listen 80;
    server_name cad.visitworld.me;

    location /.well-known/acme-challenge/ {
        root /opt/visitworld-deploy/acme;
        default_type text/plain;
        allow all;
    }

    location / {
        proxy_pass http://127.0.0.1:8780;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        client_max_body_size 80m;
    }

    # Chat may stream; do not buffer upstream.
    location /api/ {
        proxy_pass http://127.0.0.1:8780;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        client_max_body_size 80m;
    }
}
